services:

  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seeder:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - seeder_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run seed:test"
    environment:
      MONGODB_URI: mongodb://mongo:27017/inomedia-test
    depends_on:
      mongo:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/inomedia-test
      IRON_SESSION_PASSWORD: test-session-password-must-be-32-chars-long
      DEV_MODE: "true"
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      # SMTP is bypassed in DEV_MODE but must be defined
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: noreply@test.ro
    depends_on:
      seeder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  seeder_node_modules:
